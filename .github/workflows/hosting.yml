name: Build and push ArchivesSpace Hosting Docker Image

on:
  push:
    branches:
      - "v*-hosting-p*"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Configs
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::388502511949:role/github_actions
          role-session-name: oidc

      - name: Switch role to aspace (hosting) account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::513816696638:role/DevOpsRole
          role-session-name: aspace
          role-chaining: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: archivesspace
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          # Remove 'v' prefix from branch name for image tag
          TAG_NAME=${IMAGE_TAG#v}
          docker build --platform linux/${{ matrix.arch }} -t $REGISTRY/$REPOSITORY:$TAG_NAME-${{ matrix.arch }} .
          docker push $REGISTRY/$REPOSITORY:$TAG_NAME-${{ matrix.arch }}

  push-manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::388502511949:role/github_actions
          role-session-name: oidc

      - name: Switch role to aspace (hosting) account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::513816696638:role/DevOpsRole
          role-session-name: aspace
          role-chaining: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Push multi-arch manifest to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: archivesspace
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          # Remove 'v' prefix from branch name for image tag
          TAG_NAME=${IMAGE_TAG#v}
          docker buildx imagetools create -t $REGISTRY/$REPOSITORY:$TAG_NAME \
            $REGISTRY/$REPOSITORY:$TAG_NAME-amd64 \
            $REGISTRY/$REPOSITORY:$TAG_NAME-arm64
